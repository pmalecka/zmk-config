    #   remote: nickconway
    #   revision: dev
    #   import: app/west.yml
    # - name: zmk
    #   remote: urob
    #   revision: main
    #   import: app/west.yml
    # - name: zmk
    #   remote: petejohanson
    #   revision: feat/pointers-move-scroll
    #   import: app/west.yml
    # - name: zmk
    #   remote: infused-kim
    #   revision: pr-testing/mouse_ps2_module_base_urob
    #   import: app/west.yml
    - name: nice-view-battery
      remote: infely
      revision: main
    # - name: prospector-zmk-module
    #   remote: pmalecka
    #   revision: old-zmk
    - name: pim447
      remote: pmalecka
      revision: new-zmk
  self:
    path: config
